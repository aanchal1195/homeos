name: homeos
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: homeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
      POSTGRES_DB: homeos
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeos -d homeos"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://homeos:${POSTGRES_PASSWORD:-local_dev_only_change_me}@db:5432/homeos
      REDIS_URL: redis://redis:6379/0
      HOMEOS_DEMO_MODE: 'true'
      PYTHONPATH: /srv/homeos
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: [uploads:/srv/homeos/uploads]
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 10
  web:
    build: ./apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api: {condition: service_healthy}
    ports: ["127.0.0.1:3000:3000"]
volumes:
  pgdata:
  redisdata:
  uploads:
