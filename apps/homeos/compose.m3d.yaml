# Optional overlay. Run with -f compose.yaml -f compose.m3d.yaml.
# Same Compose project, database and named volumes as the existing M2C deployment.
name: homeos
services:
  api:
    environment:
      HOMEOS_MEMORY_ENABLED: ${HOMEOS_MEMORY_ENABLED:-false}
  memory:
    profiles: ["memory"]
    build:
      context: ${HOMEOS_MEMORY_SOURCE_PATH:-../homeos-github/services/memory}
    environment:
      DATABASE_URL: postgresql://homeos:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/homeos
      HOMEOS_API_TOKEN: ${HOMEOS_API_TOKEN:?Set HOMEOS_API_TOKEN}
      HOMEOS_WORKER_TOKEN: ${HOMEOS_WORKER_TOKEN:-}
      HOMEOS_HOUSEHOLD_ID: ${HOMEOS_HOUSEHOLD_ID:?Set HOMEOS_HOUSEHOLD_ID}
      PRIVATE_MEDIA_ROOT: /srv/memory/private_media
      HOMEOS_VISION_API_KEY: ${HOMEOS_VISION_API_KEY:-}
      HOMEOS_VISION_MODEL: ${HOMEOS_VISION_MODEL:-gpt-4.1-mini}
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:8001:8001"]
    volumes: [memory_media:/srv/memory/private_media]
volumes:
  memory_media:
