name: Home Memory Graph
on:
  push:
    paths:
      - "services/memory/**"
      - ".github/workflows/memory.yml"
  pull_request:
    paths:
      - "services/memory/**"
      - ".github/workflows/memory.yml"
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: homeos
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: homeos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homeos -d homeos_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    defaults:
      run:
        working-directory: services/memory
    env:
      DATABASE_URL: postgresql://homeos:testpassword@localhost:5432/homeos_test
      PYTHONPATH: ${{ github.workspace }}/services/memory
      HOMEOS_API_TOKEN: ci-testing-token
      HOMEOS_WORKER_TOKEN: ci-worker-token
      HOMEOS_HOUSEHOLD_ID: 11111111-1111-4111-8111-111111111111
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema/001_home_memory.sql
        env:
          PGPASSWORD: testpassword
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema/002_visual_memory.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema/003_visual_analysis.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema/004_staged_visual_worker.sql
      - run: python -m compileall -q app.py graph_routes.py visual_routes.py vision_analysis.py visual_analysis_routes.py tests
      - run: pytest -q tests
